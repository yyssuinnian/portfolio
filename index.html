<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点击爆炸解压游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{overflow:hidden;background:#111;color:#fff;user-select:none;}
canvas{display:block;cursor:crosshair;}

/* 顶部状态栏 */
.status-bar{
  position:fixed;top:20px;left:0;right:0;
  display:flex;justify-content:space-between;padding:0 30px;
  font-size:20px;font-weight:bold;text-shadow:0 0 6px #000;
  z-index:20;
}

/* 通用面板 */
.panel{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);
  padding:40px 60px;border-radius:16px;text-align:center;
  z-index:30;
}
.panel h2{font-size:28px;margin-bottom:25px;}
.panel .score-text{font-size:22px;margin-bottom:20px;color:#ffd700;}
.btn-group{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;}
.difficulty-btn{
  padding:12px 28px;border:none;border-radius:10px;
  font-size:16px;cursor:pointer;color:#fff;transition:0.2s;
}
.difficulty-btn:hover{transform:scale(1.05);}
.easy{background:#4caf50;}
.normal{background:#ff9800;}
.hard{background:#f44336;}
.restart-btn{background:#2196f3;padding:12px 36px;border:none;border-radius:10px;color:#fff;font-size:16px;cursor:pointer;}
.restart-btn:hover{background:#1976d2;}

.hidden{display:none;}
</style>
</head>
<body>

<div class="status-bar">
  <div>分数：<span id="score">0</span></div>
  <div>剩余机会：<span id="lives">5</span></div>
</div>

<!-- 难度选择面板 -->
<div id="difficultyPanel" class="panel">
  <h2>选择难度开始游戏</h2>
  <div class="btn-group">
    <button class="difficulty-btn easy" data-diff="easy">简单</button>
    <button class="difficulty-btn normal" data-diff="normal">普通</button>
    <button class="difficulty-btn hard" data-diff="hard">困难</button>
  </div>
</div>

<!-- 游戏结束面板 -->
<div id="gameOverPanel" class="panel hidden">
  <h2>游戏结束</h2>
  <div class="score-text">最终得分：<span id="finalScore">0</span></div>
  <button class="restart-btn" id="restartBtn">重新开始</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

// ========== 难度配置 ==========
const difficultyConfig = {
  easy: {
    startSpeed: 2,       // 初始下落速度
    spawnInterval: 1200, // 生成间隔(ms)
    speedIncrement: 0.3, // 每次加速幅度
    maxSpeed: 5,         // 速度上限
    scoreMultiplier: 1   // 分数倍率
  },
  normal: {
    startSpeed: 3,
    spawnInterval: 900,
    speedIncrement: 0.5,
    maxSpeed: 8,
    scoreMultiplier: 1.5
  },
  hard: {
    startSpeed: 4.5,
    spawnInterval: 600,
    speedIncrement: 0.7,
    maxSpeed: 12,
    scoreMultiplier: 2
  }
};

// ========== 游戏状态 ==========
let gameState = 'waiting'; // waiting / playing / over
let score = 0;
let lives = 5;
let currentSpeed = 0;
let currentConfig = null;
let spawnTimer = null;
let speedUpTimer = null;

let fallingItems = []; // 掉落物数组
let particles = [];    // 粒子数组

// ========== 掉落物类 ==========
class FallingItem {
  constructor(){
    this.radius = Math.random()*15 + 25; // 大小25-40
    this.x = Math.random()*(w - this.radius*2) + this.radius;
    this.y = -this.radius;
    this.speed = currentSpeed;
    this.color = `hsl(${Math.random()*360}, 80%, 60%)`;
  }
  update(){
    this.y += this.speed;
  }
  draw(){
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
    ctx.fill();
    // 高光效果
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(this.x - this.radius*0.3, this.y - this.radius*0.3, this.radius*0.4, 0, Math.PI*2);
    ctx.fill();
  }
}

// ========== 粒子类 ==========
class Particle {
  constructor(x,y,color){
    this.x = x;
    this.y = y;
    this.size = Math.random()*6 + 2;
    this.speedX = Math.random()*8 - 4;
    this.speedY = Math.random()*8 - 4;
    this.color = color;
    this.life = 1;
    this.decay = Math.random()*0.02 + 0.01;
  }
  update(){
    this.x += this.speedX;
    this.y += this.speedY;
    this.speedY += 0.15; // 重力
    this.life -= this.decay;
  }
  draw(){
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// ========== 生成爆炸粒子 ==========
function spawnExplosion(x,y,color,count=30){
  for(let i=0;i<count;i++){
    particles.push(new Particle(x,y,color));
  }
}

// ========== 音效 ==========
let audioCtx;
function playPopSound(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(700, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.1);
}

// ========== 开始游戏 ==========
function startGame(difficulty){
  currentConfig = difficultyConfig[difficulty];
  currentSpeed = currentConfig.startSpeed;
  score = 0;
  lives = 5;
  fallingItems = [];
  particles = [];
  gameState = 'playing';

  // 更新UI
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('difficultyPanel').classList.add('hidden');
  document.getElementById('gameOverPanel').classList.add('hidden');

  // 启动生成定时器
  spawnTimer = setInterval(()=>{
    if(gameState === 'playing'){
      fallingItems.push(new FallingItem());
    }
  }, currentConfig.spawnInterval);

  // 启动速度递增（每10秒加速一次）
  speedUpTimer = setInterval(()=>{
    if(gameState === 'playing' && currentSpeed < currentConfig.maxSpeed){
      currentSpeed += currentConfig.speedIncrement;
      if(currentSpeed > currentConfig.maxSpeed){
        currentSpeed = currentConfig.maxSpeed;
      }
    }
  }, 10000);
}

// ========== 游戏结束 ==========
function gameOver(){
  gameState = 'over';
  clearInterval(spawnTimer);
  clearInterval(speedUpTimer);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOverPanel').classList.remove('hidden');
}

// ========== 动画循环 ==========
function animate(){
  // 背景拖尾效果
  ctx.fillStyle = 'rgba(17,17,17,0.2)';
  ctx.fillRect(0,0,w,h);

  if(gameState === 'playing'){
    // 更新掉落物
    for(let i = fallingItems.length-1; i >= 0; i--){
      const item = fallingItems[i];
      item.update();
      item.draw();

      // 检测是否漏掉（掉出屏幕）
      if(item.y - item.radius > h){
        fallingItems.splice(i,1);
        lives--;
        document.getElementById('lives').textContent = lives;
        
        if(lives <= 0){
          gameOver();
        }
      }
    }
  }

  // 更新粒子
  for(let i = particles.length-1; i >= 0; i--){
    const p = particles[i];
    p.update();
    p.draw();
    if(p.life <= 0){
      particles.splice(i,1);
    }
  }

  requestAnimationFrame(animate);
}
animate();

// ========== 修复：精准点击检测 ==========
canvas.addEventListener('click', (e)=>{
  if(gameState !== 'playing') return;

  // 1. 获取canvas在页面中的实际位置，修正坐标偏移
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  // 2. 点击判定容差（额外增加12px判定范围）
  const hitTolerance = 12;

  // 从后往前检测，优先点最上层的
  for(let i = fallingItems.length-1; i >= 0; i--){
    const item = fallingItems[i];
    const dx = clickX - item.x;
    const dy = clickY - item.y;
    const distance = Math.hypot(dx, dy);

    // 3. 判定半径 = 实际半径 + 容差
    if(distance <= item.radius + hitTolerance){
      // 爆炸特效
      spawnExplosion(item.x, item.y, item.color, 35);
      playPopSound();
      
      // 加分
      const addScore = Math.round(10 * currentConfig.scoreMultiplier);
      score += addScore;
      document.getElementById('score').textContent = score;

      // 移除掉落物
      fallingItems.splice(i,1);
      break; // 一次只点中一个
    }
  }
});

// ========== 按钮事件 ==========
// 难度选择
document.querySelectorAll('.difficulty-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const diff = btn.dataset.diff;
    startGame(diff);
  });
});

// 重新开始
document.getElementById('restartBtn').addEventListener('click', ()=>{
  document.getElementById('gameOverPanel').classList.add('hidden');
  document.getElementById('difficultyPanel').classList.remove('hidden');
  gameState = 'waiting';
});

// 窗口自适应
window.addEventListener('resize', ()=>{
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
});
</script>
</body>
</html>
