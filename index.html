<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>解压小游戏合集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;-webkit-tap-highlight-color:transparent;}
body{overflow:hidden;background:#111;color:#fff;user-select:none;touch-action:none;}
canvas{display:block;cursor:crosshair;}

/* 顶部状态栏 */
.status-bar{
  position:fixed;top:20px;left:0;right:0;
  display:flex;justify-content:space-between;padding:0 30px;
  font-size:20px;font-weight:bold;text-shadow:0 0 6px #000;
  z-index:20;
}

/* 通用面板 */
.panel{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.65);backdrop-filter:blur(10px);
  padding:40px 60px;border-radius:16px;text-align:center;
  z-index:30;min-width:320px;
}
.panel h2{font-size:28px;margin-bottom:25px;}
.panel .score-text{font-size:22px;margin-bottom:20px;color:#ffd700;}
.btn-group{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;}
.btn{
  padding:12px 28px;border:none;border-radius:10px;
  font-size:16px;cursor:pointer;color:#fff;transition:0.2s;
}
.btn:hover{transform:scale(1.05);}
.game-btn{background:#2196f3;width:100%;margin-bottom:12px;}
.easy{background:#4caf50;}
.normal{background:#ff9800;}
.hard{background:#f44336;}
.restart-btn{background:#2196f3;padding:12px 36px;}
.back-btn{background:#666;padding:12px 24px;}

.hidden{display:none;}
</style>
</head>
<body>

<div class="status-bar">
  <div>分数：<span id="score">0</span></div>
  <div>剩余机会：<span id="lives">5</span></div>
</div>

<!-- 游戏选择面板 -->
<div id="gameSelectPanel" class="panel">
  <h2>选择游戏</h2>
  <button class="btn game-btn" data-game="fall">掉落爆炸</button>
  <button class="btn game-btn" data-game="plane">飞机空战</button>
</div>

<!-- 难度选择面板 -->
<div id="difficultyPanel" class="panel hidden">
  <h2>选择难度</h2>
  <div class="btn-group">
    <button class="btn easy" data-diff="easy">简单</button>
    <button class="btn normal" data-diff="normal">普通</button>
    <button class="btn hard" data-diff="hard">困难</button>
  </div>
  <button class="btn back-btn" id="backToGame" style="margin-top:20px;">返回</button>
</div>

<!-- 游戏结束面板 -->
<div id="gameOverPanel" class="panel hidden">
  <h2>游戏结束</h2>
  <div class="score-text">最终得分：<span id="finalScore">0</span></div>
  <div class="btn-group">
    <button class="btn restart-btn" id="restartBtn">再来一局</button>
    <button class="btn back-btn" id="backBtn">返回首页</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

// ========== 全局状态 ==========
let gameState = 'select'; // select / difficulty / playing / over
let currentGame = 'fall'; // fall / plane
let score = 0;
let lives = 5;
let currentSpeed = 0;
let currentConfig = null;
let spawnTimer = null;
let speedUpTimer = null;

let entities = [];   // 游戏主体（掉落球/飞球）
let particles = [];  // 粒子
let bullets = [];    // 飞机游戏子弹
let plane = null;    // 飞机对象

// ========== 难度配置（速度已整体调快，困难无上限） ==========
const difficultyConfig = {
  easy: {
    startSpeed: 3,
    spawnInterval: 1000,
    speedIncrement: 0.4,
    maxSpeed: 7,
    scoreMultiplier: 1
  },
  normal: {
    startSpeed: 4.5,
    spawnInterval: 750,
    speedIncrement: 0.6,
    maxSpeed: 11,
    scoreMultiplier: 1.5
  },
  hard: {
    startSpeed: 6.5,
    spawnInterval: 500,
    speedIncrement: 0.8,
    maxSpeed: Infinity, // 困难无上限
    scoreMultiplier: 2
  }
};

// ========== 粒子类（通用） ==========
class Particle {
  constructor(x,y,color){
    this.x = x; this.y = y;
    this.size = Math.random()*6 + 2;
    this.speedX = Math.random()*8 - 4;
    this.speedY = Math.random()*8 - 4;
    this.color = color;
    this.life = 1;
    this.decay = Math.random()*0.02 + 0.01;
  }
  update(){
    this.x += this.speedX;
    this.y += this.speedY;
    this.speedY += 0.15;
    this.life -= this.decay;
  }
  draw(){
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function spawnExplosion(x,y,color,count=35){
  for(let i=0;i<count;i++){
    particles.push(new Particle(x,y,color));
  }
}

// ========== 音效（通用） ==========
let audioCtx;
function playPopSound(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(700, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.1);
}

// ========== 掉落游戏：掉落球类 ==========
class FallingBall {
  constructor(){
    this.radius = Math.random()*15 + 25;
    this.x = Math.random()*(w - this.radius*2) + this.radius;
    this.y = -this.radius;
    this.speed = currentSpeed;
    this.color = `hsl(${Math.random()*360}, 80%, 60%)`;
  }
  update(){
    this.y += this.speed;
  }
  draw(){
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(this.x - this.radius*0.3, this.y - this.radius*0.3, this.radius*0.4, 0, Math.PI*2);
    ctx.fill();
  }
  checkMiss(){
    return this.y - this.radius > h;
  }
}

// ========== 飞机游戏：飞球类 ==========
class FlyingBall {
  constructor(){
    this.radius = Math.random()*12 + 20;
    this.x = w + this.radius;
    this.y = Math.random()*(h - this.radius*2) + this.radius;
    this.speed = currentSpeed;
    this.color = `hsl(${Math.random()*360}, 80%, 60%)`;
  }
  update(){
    this.x -= this.speed;
  }
  draw(){
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(this.x - this.radius*0.3, this.y - this.radius*0.3, this.radius*0.4, 0, Math.PI*2);
    ctx.fill();
  }
  checkMiss(){
    return this.x + this.radius < 0;
  }
}

// ========== 飞机游戏：子弹类 ==========
class Bullet {
  constructor(x,y){
    this.x = x;
    this.y = y;
    this.speed = 12;
    this.radius = 4;
  }
  update(){
    this.x += this.speed;
  }
  draw(){
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
    ctx.fill();
  }
}

// ========== 飞机游戏：飞机类 ==========
class Plane {
  constructor(){
    this.x = 80;
    this.y = h / 2;
    this.width = 60;
    this.height = 40;
    this.fireTimer = 0;
    this.fireRate = 150; // 发射间隔ms
  }
  update(deltaTime){
    // 自动发射子弹
    this.fireTimer += deltaTime;
    if(this.fireTimer >= this.fireRate){
      this.fireTimer = 0;
      bullets.push(new Bullet(this.x + this.width/2, this.y));
    }
  }
  draw(){
    // 简易飞机造型
    ctx.fillStyle = '#4fc3f7';
    ctx.beginPath();
    ctx.moveTo(this.x + this.width, this.y);
    ctx.lineTo(this.x, this.y - this.height/2);
    ctx.lineTo(this.x + 15, this.y);
    ctx.lineTo(this.x, this.y + this.height/2);
    ctx.closePath();
    ctx.fill();
    // 机尾火焰
    ctx.fillStyle = '#ff9800';
    ctx.beginPath();
    ctx.moveTo(this.x, this.y - 8);
    ctx.lineTo(this.x - 15 - Math.random()*10, this.y);
    ctx.lineTo(this.x, this.y + 8);
    ctx.closePath();
    ctx.fill();
  }
  setY(y){
    this.y = Math.max(30, Math.min(h-30, y));
  }
}

// ========== 开始游戏 ==========
function startGame(gameType, difficulty){
  currentGame = gameType;
  currentConfig = difficultyConfig[difficulty];
  currentSpeed = currentConfig.startSpeed;
  score = 0;
  lives = 5;
  entities = [];
  particles = [];
  bullets = [];
  gameState = 'playing';

  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('gameSelectPanel').classList.add('hidden');
  document.getElementById('difficultyPanel').classList.add('hidden');
  document.getElementById('gameOverPanel').classList.add('hidden');

  // 初始化飞机
  if(gameType === 'plane'){
    plane = new Plane();
  }

  // 生成实体定时器
  spawnTimer = setInterval(()=>{
    if(gameState !== 'playing') return;
    if(gameType === 'fall'){
      entities.push(new FallingBall());
    }else if(gameType === 'plane'){
      entities.push(new FlyingBall());
    }
  }, currentConfig.spawnInterval);

  // 速度递增定时器（每8秒加速一次）
  speedUpTimer = setInterval(()=>{
    if(gameState !== 'playing') return;
    if(currentSpeed < currentConfig.maxSpeed){
      currentSpeed += currentConfig.speedIncrement;
    }
  }, 8000);
}

// ========== 游戏结束 ==========
function gameOver(){
  gameState = 'over';
  clearInterval(spawnTimer);
  clearInterval(speedUpTimer);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOverPanel').classList.remove('hidden');
}

// ========== 命中处理 ==========
function hitEntity(entity){
  spawnExplosion(entity.x, entity.y, entity.color, 35);
  playPopSound();
  const addScore = Math.round(10 * currentConfig.scoreMultiplier);
  score += addScore;
  document.getElementById('score').textContent = score;
}

// ========== 动画循环 ==========
let lastTime = 0;
function animate(time){
  const deltaTime = time - lastTime;
  lastTime = time;

  ctx.fillStyle = 'rgba(17,17,17,0.2)';
  ctx.fillRect(0,0,w,h);

  if(gameState === 'playing'){
    // 更新实体
    for(let i = entities.length-1; i >= 0; i--){
      const item = entities[i];
      item.update();
      item.draw();

      // 检测漏掉
      if(item.checkMiss()){
        entities.splice(i,1);
        lives--;
        document.getElementById('lives').textContent = lives;
        if(lives <= 0) gameOver();
        continue;
      }

      // 飞机游戏：子弹碰撞检测
      if(currentGame === 'plane'){
        for(let j = bullets.length-1; j >= 0; j--){
          const bullet = bullets[j];
          const dx = bullet.x - item.x;
          const dy = bullet.y - item.y;
          const dist = Math.hypot(dx, dy);
          if(dist <= item.radius + bullet.radius){
            hitEntity(item);
            entities.splice(i,1);
            bullets.splice(j,1);
            break;
          }
        }
      }
    }

    // 更新子弹
    if(currentGame === 'plane'){
      plane.update(deltaTime);
      plane.draw();
      for(let i = bullets.length-1; i >= 0; i--){
        bullets[i].update();
        bullets[i].draw();
        if(bullets[i].x > w) bullets.splice(i,1);
      }
    }
  }

  // 更新粒子
  for(let i = particles.length-1; i >= 0; i--){
    const p = particles[i];
    p.update();
    p.draw();
    if(p.life <= 0) particles.splice(i,1);
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ========== 输入处理（鼠标+触摸统一优化） ==========
const hitTolerance = 18; // 触控容差加大

function getCanvasPos(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

// 点击/触摸：掉落游戏点爆球；飞机游戏拖动飞机
canvas.addEventListener('pointerdown', (e)=>{
  e.preventDefault();
  if(gameState !== 'playing') return;

  const pos = getCanvasPos(e.clientX, e.clientY);

  if(currentGame === 'fall'){
    // 掉落游戏：点击爆炸
    for(let i = entities.length-1; i >= 0; i--){
      const item = entities[i];
      const dx = pos.x - item.x;
      const dy = pos.y - item.y;
      const dist = Math.hypot(dx, dy);
      if(dist <= item.radius + hitTolerance){
        hitEntity(item);
        entities.splice(i,1);
        break;
      }
    }
  }else if(currentGame === 'plane'){
    // 飞机游戏：拖动飞机
    plane.setY(pos.y);
  }
});

// 飞机游戏：拖动跟随
canvas.addEventListener('pointermove', (e)=>{
  e.preventDefault();
  if(gameState !== 'playing' || currentGame !== 'plane') return;
  const pos = getCanvasPos(e.clientX, e.clientY);
  plane.setY(pos.y);
});

// ========== 按钮事件 ==========
// 游戏选择
document.querySelectorAll('.game-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentGame = btn.dataset.game;
    document.getElementById('gameSelectPanel').classList.add('hidden');
    document.getElementById('difficultyPanel').classList.remove('hidden');
  });
});

// 难度选择
document.querySelectorAll('[data-diff]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const diff = btn.dataset.diff;
    startGame(currentGame, diff);
  });
});

// 返回游戏选择
document.getElementById('backToGame').addEventListener('click', ()=>{
  document.getElementById('difficultyPanel').classList.add('hidden');
  document.getElementById('gameSelectPanel').classList.remove('hidden');
});

// 重新开始
document.getElementById('restartBtn').addEventListener('click', ()=>{
  document.getElementById('gameOverPanel').classList.add('hidden');
  document.getElementById('difficultyPanel').classList.remove('hidden');
});

// 返回首页
document.getElementById('backBtn').addEventListener('click', ()=>{
  document.getElementById('gameOverPanel').classList.add('hidden');
  document.getElementById('gameSelectPanel').classList.remove('hidden');
  gameState = 'select';
});

// 窗口自适应
window.addEventListener('resize', ()=>{
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
});
</script>
</body>
</html>
