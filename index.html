<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盛世商途 · 百年富商</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", "Songti SC", serif;
        }
        body {
            background: 
                radial-gradient(circle at 20% 10%, rgba(212,167,98,0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(139,90,43,0.08) 0%, transparent 50%),
                linear-gradient(135deg, #f7f1e3 0%, #e8dcc0 100%);
            color: #2c2416;
            min-height: 100vh;
            padding: 25px 15px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 顶部标题栏 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
        }
        .header::before, .header::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 18%;
            height: 1px;
            background: linear-gradient(to right, transparent, #d4a762);
        }
        .header::after {
            right: 0;
            background: linear-gradient(to left, transparent, #d4a762);
        }
        .header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #8b5a2b, #d4a762);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 8px;
            font-weight: 600;
        }
        .header-btns {
            display: flex;
            gap: 10px;
        }
        .header-btn {
            padding: 9px 18px;
            background: linear-gradient(135deg, #d4a762, #b8874a);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(184,135,74,0.35);
            transition: all 0.3s;
        }
        .header-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(184,135,74,0.45);
        }
        .header-btn.bank {
            background: linear-gradient(135deg, #6b8ab8, #4a6fa5);
            box-shadow: 0 4px 15px rgba(74,111,165,0.35);
        }
        .header-btn.bank:hover {
            box-shadow: 0 7px 20px rgba(74,111,165,0.45);
        }

        /* 状态栏 */
        .status-bar {
            background: linear-gradient(180deg, #ffffff 0%, #faf6ed 100%);
            border-radius: 16px;
            padding: 22px 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(212,167,98,0.2);
        }
        .status-item {
            text-align: center;
            position: relative;
        }
        .status-item:not(:last-child)::after {
            content: "";
            position: absolute;
            right: 0;
            top: 20%;
            height: 60%;
            width: 1px;
            background: linear-gradient(to bottom, transparent, #e8dcc0, transparent);
        }
        .status-label {
            font-size: 13px;
            color: #998670;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .status-value {
            font-size: 24px;
            font-weight: 600;
            color: #8b5a2b;
        }
        .profit-positive {
            color: #1e8449;
        }
        .profit-negative {
            color: #c0392b;
        }

        /* 新闻面板 */
        .news-panel {
            background: linear-gradient(180deg, #fffbf2 0%, #fff8e7 100%);
            border: 1px solid #f0e2c7;
            border-radius: 12px;
            padding: 18px 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(146,96,31,0.05);
        }
        .news-title {
            font-size: 15px;
            font-weight: 600;
            color: #92601f;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .news-item {
            font-size: 13px;
            color: #7a6240;
            padding-left: 14px;
            position: relative;
            line-height: 1.6;
        }
        .news-item::before {
            content: "▸";
            position: absolute;
            left: 0;
            color: #d4a762;
        }

        /* 分区标题 */
        .section-title {
            font-size: 19px;
            color: #8b5a2b;
            margin: 25px 0 15px;
            padding-left: 12px;
            border-left: 5px solid #d4a762;
            font-weight: 600;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title.rare {
            border-left-color: #9b59b6;
            color: #6c3483;
        }

        /* 商品网格 */
        .goods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin-bottom: 20px;
        }
        .goods-card {
            background: linear-gradient(180deg, #ffffff 0%, #fdfbf7 100%);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
            border-top: 3px solid #d4a762;
            transition: all 0.3s;
        }
        .goods-card.rare {
            border-top-color: #9b59b6;
            background: linear-gradient(180deg, #fdfbff 0%, #f8f4fc 100%);
        }
        .goods-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
        }
        .goods-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #5c4325;
        }
        .goods-card.rare .goods-name {
            color: #6c3483;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }
        .price {
            font-size: 28px;
            font-weight: 700;
            color: #8b5a2b;
        }
        .goods-card.rare .price {
            color: #8e44ad;
        }
        .trend {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 500;
        }
        .trend-up {
            color: #c0392b;
            background: #fadbd8;
        }
        .trend-down {
            color: #1e8449;
            background: #d5f5e3;
        }
        .trend-flat {
            color: #7f8c8d;
            background: #f2f3f4;
        }
        .info-row {
            font-size: 12px;
            color: #887766;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }
        .fee-tip {
            font-size: 11px;
            color: #b9770e;
            background: #fef5e7;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }
        .risk-tip {
            font-size: 11px;
            color: #c0392b;
            background: #fdf0ef;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }
        .expire-warning {
            color: #c0392b;
            font-weight: 600;
        }
        .btn-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-top: 12px;
            row-gap: 5px;
        }
        .btn {
            padding: 7px 0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn-buy {
            background: linear-gradient(135deg, #5dade2, #3498db);
            color: white;
        }
        .btn-buy:hover {
            background: linear-gradient(135deg, #3498db, #2980b9);
            transform: translateY(-1px);
        }
        .btn-sell {
            background: linear-gradient(135deg, #f5b041, #e67e22);
            color: white;
        }
        .btn-sell:hover {
            background: linear-gradient(135deg, #e67e22, #d35400);
            transform: translateY(-1px);
        }
        .btn-all {
            grid-column: span 2;
        }

        /* 功能面板 */
        .func-panel {
            background: linear-gradient(180deg, #ffffff 0%, #faf6ed 100%);
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid rgba(212,167,98,0.15);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }
        .func-block h4 {
            font-size: 15px;
            color: #8b5a2b;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #e8dcc0;
        }
        .func-block p {
            font-size: 13px;
            color: #666;
            margin: 6px 0;
            line-height: 1.5;
        }
        .func-btn {
            width: 100%;
            padding: 9px 0;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-size: 13px;
            transition: all 0.2s;
        }
        .func-btn:hover {
            transform: translateY(-1px);
        }
        .storage-btn {
            background: linear-gradient(135deg, #f39c12, #d68910);
        }
        .house-btn {
            background: linear-gradient(135deg, #27ae60, #1e8449);
        }
        .bank-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
        }

        /* 底部操作栏 */
        .action-bar {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
            background: linear-gradient(180deg, #ffffff 0%, #faf6ed 100%);
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(212,167,98,0.15);
            margin-top: 20px;
        }
        .btn-large {
            padding: 13px 40px;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            letter-spacing: 1px;
            color: white;
        }
        .btn-next {
            background: linear-gradient(135deg, #8b5a2b, #b8874a);
            box-shadow: 0 5px 15px rgba(139,90,43,0.3);
        }
        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(139,90,43,0.4);
        }

        /* 弹窗通用样式 */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal {
            background: linear-gradient(180deg, #ffffff 0%, #faf8f3 100%);
            border-radius: 16px;
            padding: 32px;
            min-width: 420px;
            max-width: 580px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
            border: 1px solid rgba(212,167,98,0.2);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal h3 {
            font-size: 21px;
            margin-bottom: 18px;
            color: #8b5a2b;
            font-weight: 600;
        }
        .modal h4 {
            font-size: 16px;
            color: #8b5a2b;
            margin-top: 15px;
            margin-bottom: 8px;
        }
        .modal p {
            margin: 8px 0;
            line-height: 1.7;
            color: #555;
            font-size: 14px;
        }
        .modal-btns {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 25px;
        }
        .modal-btn {
            padding: 9px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            color: white;
        }
        .modal-btn-confirm {
            background: linear-gradient(135deg, #8b5a2b, #b8874a);
        }
        .modal-btn-cancel {
            background: #bdc3c7;
            color: #555;
        }
        .house-item {
            padding: 14px;
            border: 1px solid #eee;
            border-radius: 10px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .house-item:hover {
            border-color: #d4a762;
            background: #fdfaf3;
        }
        .house-item.owned {
            background: #eafaf1;
            border-color: #27ae60;
        }
        .house-item.top {
            border-color: #9b59b6;
            background: #faf6fd;
        }

        .bank-item {
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 8px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 顶部标题 -->
    <div class="header">
        <h1>🏮 盛世商途</h1>
        <div class="header-btns">
            <button class="header-btn bank" onclick="showBankModal()">🏦 钱庄</button>
            <button class="header-btn" onclick="showGuide()">📖 玩法</button>
        </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="status-item">
            <div class="status-label">时限轮次</div>
            <div class="status-value"><span id="round">1</span> / 100</div>
        </div>
        <div class="status-item">
            <div class="status-label">持有银两</div>
            <div class="status-value" id="money">1000</div>
        </div>
        <div class="status-item">
            <div class="status-label">本轮盈亏</div>
            <div class="status-value" id="profit">--</div>
        </div>
        <div class="status-item">
            <div class="status-label">仓库容量</div>
            <div class="status-value"><span id="storageUsed">0</span>/<span id="storageMax">15</span></div>
        </div>
        <div class="status-item">
            <div class="status-label">当前宅邸</div>
            <div class="status-value" id="house" style="font-size:17px;">茅草屋</div>
        </div>
    </div>

    <!-- 新闻面板 -->
    <div class="news-panel">
        <div class="news-title">📰 街市传闻（预判下轮行情）</div>
        <div class="news-list" id="newsList">
            <div class="news-item">开市大吉，暂无最新消息</div>
        </div>
    </div>

    <!-- 普通商品区 -->
    <div class="section-title">📦 寻常货物</div>
    <div class="goods-grid" id="goodsGrid"></div>

    <!-- 贵重商品区 -->
    <div class="section-title rare">💎 贵重珍奇 · 管制物品</div>
    <div class="goods-grid" id="rareGrid"></div>

    <!-- 功能面板 -->
    <div class="func-panel">
        <div class="func-block">
            <h4>📦 仓库扩建</h4>
            <p>当前容量：<span id="stoCur">15</span> 件</p>
            <p>扩建花费：<span id="stoCost">200</span> 两</p>
            <p>扩建后：<span id="stoNext">20</span> 件（+5件）</p>
            <button class="func-btn storage-btn" onclick="upgradeStorage()">立即扩建</button>
        </div>
        <div class="func-block">
            <h4>🏠 宅邸权益</h4>
            <p>当前宅邸：<span id="houseName">茅草屋</span></p>
            <p>购货折扣：<span id="houseDiscount">无</span></p>
            <p>更高宅邸享更多优惠</p>
            <button class="func-btn house-btn" onclick="showHouseModal()">宅邸买卖</button>
        </div>
        <div class="func-block">
            <h4>🏦 钱庄存款</h4>
            <p>活期可用：<span id="bankFree">0</span> 两</p>
            <p>存期越久，利息越高</p>
            <p>最高可存3轮，到期自动到账</p>
            <button class="func-btn bank-btn" onclick="showBankModal()">前往钱庄</button>
        </div>
    </div>

    <!-- 底部操作栏 -->
    <div class="action-bar">
        <button class="btn-large btn-next" onclick="nextRound()">⏳ 进入下一轮</button>
    </div>

</div>

<!-- 通用弹窗 -->
<div class="modal-mask" id="modalMask">
    <div class="modal">
        <h3 id="modalTitle">提示</h3>
        <div id="modalContent"></div>
        <div class="modal-btns" id="modalBtns"></div>
    </div>
</div>

        { type: 'bad', text: '官府征收商税', rate: 0.08, desc: '扣除总资产8%的银两' },
        { type: 'bad', text: '遭遇地痞无赖', rate: 0.05, desc: '损失总资产5%的钱财' },
        { type: 'bad', text: '仓库漏雨受潮', rate: 0.1, desc: '所有货物价值贬值10%' },
        { type: 'good', text: '偶遇贵人赏识', rate: 0.1, desc: '获得总资产10%的赏银' },
        { type: 'good', text: '生意火爆', rate: 0.08, desc: '额外盈利总资产8%' },
        { type: 'good', text: '挖到前朝地窖', rate: 0.15, desc: '意外获得总资产15%的财富' },
        { type: 'neutral', text: '庙会赶集', rate: 0.05, desc: '所有商品销量增加，价格上浮5%' }
    ];

    // 银行利率配置
    const bankRates = {
        1: 0.02,
        2: 0.05,
        3: 0.1
    };

    // ===================== 游戏状态 =====================
    let game = {
        round: 1,
        money: 1000,
        maxStorage: 15,
        house: 'hut',
        goods: {},
        lastPrices: {},
        lastTotalAsset: 1000,
        bankDeposits: [], // {amount, roundsLeft}
        gameOver: false
    };

    // 初始化商品数据
    goodsConfig.forEach(g => {
        game.goods[g.id] = { hold: 0, price: g.basePrice, expireLeft: g.expire };
        game.lastPrices[g.id] = g.basePrice;
    });

    // ===================== 工具函数 =====================
    function getCurHouse() {
        return houseList.find(h => h.id === game.house);
    }

    function getBuyDiscount() {
        return 1 - getCurHouse().discount;
    }

    function getTotalAsset() {
        let total = game.money;
        // 银行存款
        game.bankDeposits.forEach(d => total += d.amount);
        // 货物估值
        goodsConfig.forEach(g => {
            total += game.goods[g.id].hold * game.goods[g.id].price;
        });
        // 房产估值
        total += getCurHouse().price * 0.8;
        return total;
    }

    function getStorageUpgradeCost() {
        // 每多5格，费用增加100两
        const times = (game.maxStorage - 15) / 5;
        return 200 + times * 100;
    }

    // ===================== 渲染函数 =====================
    function renderGoodsCards() {
        const normalGrid = document.getElementById('goodsGrid');
        const rareGrid = document.getElementById('rareGrid');
        normalGrid.innerHTML = '';
        rareGrid.innerHTML = '';

                <div class="price-row">
                    <span class="price" id="price_${goods.id}">${goods.basePrice}</span>
                    <span class="trend trend-flat" id="trend_${goods.id}">— 持平</span>
                </div>
                <div class="info-row">
                    <span>持有：<span id="hold_${goods.id}">0</span> 件</span>
                    <span class="fee-tip">${feeText}</span>
                </div>
                <div class="info-row">
                    <span id="expire_${goods.id}">永久保质</span>

                </div>
                <div class="btn-group">
                    <button class="btn btn-buy" onclick="buyGoods('${goods.id}', 1)">买1</button>
                    <button class="btn btn-buy" onclick="buyGoods('${goods.id}', 3)">买3</button>
                    <button class="btn btn-buy" onclick="buyGoods('${goods.id}', 10)">买10</button>
                    <button class="btn btn-buy btn-all" onclick="buyAll('${goods.id}')">一键买满</button>
                    <button class="btn btn-sell" onclick="sellGoods('${goods.id}', 1)">卖1</button>
                    <button class="btn btn-sell" onclick="sellGoods('${goods.id}', 3)">卖3</button>
                    <button class="btn btn-sell" onclick="sellGoods('${goods.id}', 10)">卖10</button>
                    <button class="btn btn-sell btn-all" onclick="sellAll('${goods.id}')">一键卖空</button>
                </div>
            `;

            if (goods.rare) {
                rareGrid.appendChild(card);
            } else {
                normalGrid.appendChild(card);

        });

    function refreshPage() {
        document.getElementById('round').innerText = game.round;
        document.getElementById('money').innerText = game.money;
        document.getElementById('storageMax').innerText = game.maxStorage;
        
        let totalHold = 0;
        for (let id in game.goods) totalHold += game.goods[id].hold;
        document.getElementById('storageUsed').innerText = totalHold;

        const house = getCurHouse();
        document.getElementById('house').innerText = house.name;
        document.getElementById('houseName').innerText = house.name;
        document.getElementById('houseDiscount').innerText = house.discount > 0 ? `${(house.discount*100).toFixed(0)}%优惠` : '无';

        // 仓库扩建信息
        document.getElementById('stoCur').innerText = game.maxStorage;
        document.getElementById('stoCost').innerText = getStorageUpgradeCost();
        document.getElementById('stoNext').innerText = game.maxStorage + 5;

        // 银行活期
        let freeMoney = 0;
        game.bankDeposits.forEach(d => {
            if (d.roundsLeft <= 0) freeMoney += d.amount;
        });
        document.getElementById('bankFree').innerText = freeMoney;

        // 盈亏计算
        const profit = getTotalAsset() - game.lastTotalAsset;
        const profitEl = document.getElementById('profit');
        if (game.round === 1) {
            profitEl.innerText = '--';
            profitEl.className = 'status-value';
        } else {
            profitEl.innerText = (profit >= 0 ? '+' : '') + profit;
            profitEl.className = 'status-value ' + (profit >= 0 ? 'profit-positive' : 'profit-negative');
        }

        // 更新每个商品
        goodsConfig.forEach(goods => {
            const item = game.goods[goods.id];
            document.getElementById(`price_${goods.id}`).innerText = item.price;
            document.getElementById(`hold_${goods.id}`).innerText = item.hold;

            // 涨跌趋势
            const trendEl = document.getElementById(`trend_${goods.id}`);
            if (item.price > game.lastPrices[goods.id]) {
                trendEl.innerText = '↑ 上涨';
                trendEl.className = 'trend trend-up';
            } else if (item.price < game.lastPrices[goods.id]) {
                trendEl.innerText = '↓ 下跌';
                trendEl.className = 'trend trend-down';
            } else {
                trendEl.innerText = '— 持平';
                trendEl.className = 'trend trend-flat';
            }

            // 保质期
            const expireEl = document.getElementById(`expire_${goods.id}`);
            if (goods.expire >= 999) {
                expireEl.innerText = '永久保质';
            } else {
                if (item.hold > 0) {
                    expireEl.innerText = `保质期：还剩${item.expireLeft}轮`;
                    if (item.expireLeft <= 1) {
                        expireEl.className = 'expire-warning';
                    } else {
                        expireEl.className = '';
                    }
                } else {
                    expireEl.innerText = `保质期：${goods.expire}轮`;
                    expireEl.className = '';
                }
            }
        });
    }

    // ===================== 交易功能 =====================
    function buyGoods(id, num) {
        if (game.gameOver) return;
        const goods = game.goods[id];
        const cfg = goodsConfig.find(g => g.id === id);
        const discount = getBuyDiscount();
        const unitPrice = Math.floor(goods.price * discount);
        const totalCost = unitPrice * num;

        if (game.money < totalCost) return;

        let totalHold = 0;
        for (let gid in game.goods) totalHold += game.goods[gid].hold;
        if (totalHold + num > game.maxStorage) return;

        game.money -= totalCost;
        goods.hold += num;
        goods.expireLeft = cfg.expire;

        refreshPage();
    }

    function buyAll(id) {
        if (game.gameOver) return;
        const goods = game.goods[id];
        const cfg = goodsConfig.find(g => g.id === id);
        const discount = getBuyDiscount();
        const unitPrice = Math.floor(goods.price * discount);

        let totalHold = 0;
        for (let gid in game.goods) totalHold += game.goods[gid].hold;
        const canBuy = game.maxStorage - totalHold;
        if (canBuy <= 0) return;

        const totalCost = unitPrice * canBuy;
        if (game.money < totalCost) {
            // 钱不够就买能买的最大数量
            const maxByMoney = Math.floor(game.money / unitPrice);
            if (maxByMoney <= 0) return;
            game.money -= unitPrice * maxByMoney;
            goods.hold += maxByMoney;
        } else {
            game.money -= totalCost;
            goods.hold += canBuy;
        }
        goods.expireLeft = cfg.expire;
        refreshPage();
    }

    function sellGoods(id, num) {
        if (game.gameOver) return;
        const goods = game.goods[id];
        
        if (goods.hold < num) num = goods.hold;
        if (num <= 0) return;

        const income = goods.price * num;
        game.money += income;
        goods.hold -= num;

        refreshPage();
    }

    function sellAll(id) {
        if (game.gameOver) return;
        const goods = game.goods[id];
        if (goods.hold <= 0) return;

        const income = goods.price * goods.hold;
        game.money += income;
        goods.hold = 0;

        refreshPage();
    }

    // ===================== 新闻系统 =====================
    function generateNews() {
        const shuffled = [...newsPool].sort(() => Math.random() - 0.5);
        const selected = shuffled.slice(0, 3);
        
        const newsList = document.getElementById('newsList');
        newsList.innerHTML = '';
        selected.forEach(news => {
            const div = document.createElement('div');
            div.className = 'news-item';
            div.innerText = news.text;
            newsList.appendChild(div);
        });

        // 保存新闻预判，下一轮生效
        game.pendingNews = selected;
    }

    function applyNewsEffect() {
        if (!game.pendingNews) return;
        
        game.pendingNews.forEach(news => {
            if (!game.goods[news.target]) return;
            const isCorrect = Math.random() < NEWS_ACCURACY;
            
            if (isCorrect) {
                if (news.isUp) {
                    game.goods[news.target].price = Math.floor(game.goods[news.target].price * 1.2);
                } else {
                    game.goods[news.target].price = Math.floor(game.goods[news.target].price * 0.85);
                }
            } else {
                if (news.isUp) {
                    game.goods[news.target].price = Math.floor(game.goods[news.target].price * 0.9);
                } else {
                    game.goods[news.target].price = Math.floor(game.goods[news.target].price * 1.1);
                }
            }
        });

        // 限制价格区间
        goodsConfig.forEach(g => {
            game.goods[g.id].price = Math.max(g.min, Math.min(g.max, game.goods[g.id].price));
        });
    }

    // ===================== 仓库扩建 =====================
    function upgradeStorage() {
        if (game.gameOver) return;
        const cost = getStorageUpgradeCost();
        if (game.money < cost) return;

        game.money -= cost;
        game.maxStorage += 5;
        refreshPage();
    }

    // ===================== 房产系统 =====================
    function showHouseModal() {
        let html = '';
        houseList.forEach(house => {
            const owned = game.house === house.id;
            const canBuy = game.money >= house.price && !owned;

                <div class="house-item ${owned ? 'owned' : ''} ${house.top ? 'top' : ''}">
                    <div>
                        <div style="font-weight:bold;">${house.name}</div>
                        <div style="font-size:12px;color:#888;">${house.desc}</div>
                        <div style="font-size:12px;color:#8b5a2b;">售价：${house.price}两</div>
                    </div>
                    <div>
                        ${owned ? 
                            (house.canSell ? 
                                `<button class="modal-btn" style="background:#e67e22;color:white;" onclick="sellHouse('${house.id}')">出售(${Math.floor(house.price*0.8)}两)</button>` 
                                : '<span style="color:#27ae60;">当前居住</span>')

    function buyHouse(id) {
        const house = houseList.find(h => h.id === id);
        if (game.money < house.price) return;

        game.money -= house.price;
        game.house = id;
        closeModal();
        refreshPage();
        checkWin();
    }

    function sellHouse(id) {
        const house = houseList.find(h => h.id === id);
        if (!house.canSell || game.house !== id) return;

        game.money += Math.floor(house.price * 0.8);
        game.house = 'hut'; // 卖了住回茅草屋
        closeModal();
        refreshPage();
    }

    // ===================== 银行系统 =====================
    function showBankModal() {
        let depositHtml = '';
        [1,2,3].forEach(rounds => {
            const rate = bankRates[rounds];
            depositHtml += `
                <div class="bank-item">
                    <div>
                        <div style="font-weight:bold;">存${rounds}轮</div>
                        <div style="font-size:12px;color:#888;">年利率${(rate*100).toFixed(0)}%，到期自动到账</div>
                    </div>
                    <button class="modal-btn modal-btn-confirm" onclick="depositMoney(${rounds})">存入</button>
                </div>
            `;
        });

        let recordHtml = '';
        if (game.bankDeposits.length === 0) {
            recordHtml = '<p style="color:#999;text-align:center;">暂无存款记录</p>';
        } else {
            game.bankDeposits.forEach((d, i) => {
                const status = d.roundsLeft > 0 ? `还有${d.roundsLeft}轮到期` : '已到期，可支取';
                recordHtml += `
                    <div class="bank-item">
                        <div>
                            <div>本金：${d.amount} 两</div>
                            <div style="font-size:12px;color:#888;">${status}</div>
                        </div>
                        ${d.roundsLeft <= 0 ? 
                            `<button class="modal-btn" style="background:#27ae60;color:white;" onclick="withdrawMoney(${i})">支取</button>`
                            : '<span style="color:#999;">锁定中</span>'
                        }
                    </div>
                `;
            });
        }

        const content = `
            <h4>存入银两</h4>
            ${depositHtml}
            <h4>存款记录</h4>
            ${recordHtml}
            <p style="font-size:12px;color:#999;margin-top:10px;">* 存期内银两无法动用，到期后可自由支取</p>
        `;
        showModal('🏦 钱庄', content);
    }

    function depositMoney(rounds) {
        const amount = Math.floor(game.money * 0.5); // 默认存一半
        if (amount <= 0) return;

        game.money -= amount;
        game.bankDeposits.push({
            amount: amount,
            roundsLeft: rounds,
            rate: bankRates[rounds]
        });

        closeModal();
        refreshPage();
    }

    function withdrawMoney(index) {
        const deposit = game.bankDeposits[index];
        if (deposit.roundsLeft > 0) return;

        const total = Math.floor(deposit.amount * (1 + deposit.rate));
        game.money += total;
        game.bankDeposits.splice(index, 1);

        closeModal();
        refreshPage();
    }

    // ===================== 随机事件 =====================
    function triggerRandomEvent() {
        const event = eventPool[Math.floor(Math.random() * eventPool.length)];
        const asset = getTotalAsset();
        const moneyChange = Math.floor(asset * event.rate);

        if (event.type === 'bad') {
            game.money = Math.max(0, game.money - moneyChange);
        } else if (event.type === 'good') {
            game.money += moneyChange;
        } else {
            // 中性事件：所有商品涨价
            goodsConfig.forEach(g => {
                game.goods[g.id].price = Math.floor(game.goods[g.id].price * (1 + event.rate));
                game.goods[g.id].price = Math.min(g.max, game.goods[g.id].price);
            });
        }
    }

    // ===================== 下一轮逻辑 =====================
    function nextRound() {
        if (game.gameOver) return;
        if (game.round >= MAX_ROUND) {
            endGame();
            return;
        }

        // 记录上轮总资产
        game.lastTotalAsset = getTotalAsset();

        // 保存上一轮价格
        goodsConfig.forEach(g => {
            game.lastPrices[g.id] = game.goods[g.id].price;
        });

        // 1. 保质期扣除
        goodsConfig.forEach(g => {
            if (g.expire < 999 && game.goods[g.id].hold > 0) {
                game.goods[g.id].expireLeft--;
                if (game.goods[g.id].expireLeft <= 0) {
                    game.goods[g.id].hold = 0;
                    game.goods[g.id].expireLeft = g.expire;
                }
            }
        });

        // 2. 扣除保管费
        let totalFee = 0;
        goodsConfig.forEach(g => {
            if (game.goods[g.id].hold > 0) {
                const fee = Math.floor(game.goods[g.id].hold * game.goods[g.id].price * g.storageFeeRate);
                totalFee += fee;
            }
        });
        game.money = Math.max(0, game.money - totalFee);

        // 3. 银行存款倒计时
        game.bankDeposits.forEach(d => {
            if (d.roundsLeft > 0) d.roundsLeft--;
        });

        // 4. 基础价格波动
        goodsConfig.forEach(g => {
            const wave = g.basePrice * 0.35;
            const change = (Math.random() - 0.5) * 2 * wave;
            let newPrice = Math.floor(g.basePrice + change);
            newPrice = Math.max(g.min, Math.min(g.max, newPrice));
            game.goods[g.id].price = newPrice;
        });

        // 5. 应用上一轮新闻的效果
        applyNewsEffect();

        // 6. 生成下一轮的新闻预判
        generateNews();

        // 7. 管制物品查抄（进入下一轮才检查）
        goodsConfig.forEach(g => {
            if (g.contraband && game.goods[g.id].hold > 0) {
                const seizeChance = game.goods[g.id].hold * 0.02;
                if (Math.random() < seizeChance) {
                    const seizeNum = Math.min(game.goods[g.id].hold, Math.floor(Math.random() * 2) + 1);
                    game.goods[g.id].hold -= seizeNum;
                }
            }
        });

        // 8. 随机事件（30%概率）
        if (Math.random() < 0.3) {
            triggerRandomEvent();
        }

        game.round++;
        refreshPage();
        checkWin();

        if (game.round >= MAX_ROUND) {
            setTimeout(() => endGame(), 500);
        }
    }

    // ===================== 游戏结束 =====================

        const totalAsset = getTotalAsset();
        const curHouse = getCurHouse();

        let rank = '';
        if (game.house === 'zhenguo') {
            rank = '🎉 一代传奇 · 镇国富商';
        } else if (totalAsset >= 500000) {
            rank = '🥇 富甲天下 · 当世巨贾';
        } else if (totalAsset >= 100000) {
            rank = '🥈 腰缠万贯 · 地方首富';
        } else if (totalAsset >= 20000) {
            rank = '🥉 家境殷实 · 成功商人';
        } else if (totalAsset >= 5000) {
            rank = '📌 小有积蓄 · 寻常商户';
        } else {
            rank = '💔 百年蹉跎 · 勉强糊口';
        }

        showAlert('⏳ 百年已至 · 人生结算', 
            `一百年时光匆匆而过，你的商途就此落幕。\n\n` +
            `最终宅邸：${curHouse.name}\n` +
            `现有银两：${game.money} 两\n` +
            `总资产估值：${totalAsset} 两\n\n` +
            `【评价】${rank}\n\n` +
            `人生百年，求财一场，皆是云烟。`
        );
    }

    function checkWin() {
        if (game.house === 'zhenguo') {
            game.gameOver = true;
            setTimeout(() => {
                showAlert('🎉 恭喜通关', 
                    `你用了${game.round}轮时间，从一介布衣做到镇国王府的主人。\n最终身家百万，裂土封王，名垂青史！\n\n百年之期未至，你已登临绝顶。`
                );
            }, 300);
        }
    }

    }

    function showAlert(title, text) {
        showModal(title, `<p style="white-space:pre-line;">${text}</p>`);
    }

    function closeModal() {
        document.getElementById('modalMask').style.display = 'none';
    }

    // ===================== 初始化 =====================
    renderGoodsCards();
    generateNews();
    refreshPage();

</script>
</body>
</html>
